server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16M;
    server_tokens off;

    location / {
        # Static files only: requests handed to index.php get the full header
        # set (including the nonce-based CSP) from SecurityHeaders middleware.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted Vite assets never change; cache them for a year.
    location /build/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded files are never executable, even if one slips into public/.
    location ~* ^/storage/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; return 404; }

    error_page 404 /index.php;

    # Only the front controller is handed to PHP.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
